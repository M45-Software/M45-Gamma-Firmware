name: Web Flasher Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual Pages publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web flasher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build web flasher package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            scripts/docker-web-flasher.sh --version "$PACKAGE_VERSION"
          else
            scripts/docker-web-flasher.sh
          fi
          mv dist/web-flasher site

      - name: Validate web flasher package
        run: |
          test -f site/index.html
          test -f site/canonical-releases.json
          test -f site/esp-miner.bin
          test ! -e site/manifest.json
          test ! -e site/bootloader.bin
          test ! -e site/partition-table.bin
          shopt -s nullglob
          firmware=(site/esp-miner-factory-602-*.bin)
          test "${#firmware[@]}" -ge 1
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path("site/canonical-releases.json").read_text())
          canonical_releases = canonical.get("releases") or []
          if len(canonical_releases) != 1:
              raise SystemExit("canonical manifest must contain exactly one latest release")
          release = canonical_releases[0]
          ota_path = Path("site") / release.get("ota_path", "")
          flash_path = Path("site") / release.get("flash_path", "")
          if ota_path != Path("site/esp-miner.bin") or not ota_path.is_file():
              raise SystemExit("canonical OTA path must point to site/esp-miner.bin")
          if not flash_path.name.startswith("esp-miner-factory-602-") or not flash_path.is_file():
              raise SystemExit("canonical flash path must point to the Gamma 602 factory image")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
